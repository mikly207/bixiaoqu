name: Build iOS IPA (哔小趣 v4.73.0)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: flutter-ios

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - run: flutter pub get

      # 关键修复：删除旧 ios 目录后用 Flutter 3.24 全新生成，
      # 保证 project.pbxproj 与 Podfile 的 RunnerTests target 一致（否则 CocoaPods 1.17 报错）
      - name: Fresh iOS project
        run: |
          rm -rf ios
          flutter create --platforms=ios --org com.bixiaoqu --project-name bixiaoqu .
          grep -c RunnerTests ios/Runner.xcodeproj/project.pbxproj || true

      # 构建 release IPA（跳过签名）
      - name: Build IPA
        run: flutter build ipa --release --no-codesign

      - name: List IPA
        run: ls -lh build/ios/ipa/ || true

      - uses: actions/upload-artifact@v4
        with:
          name: bixiaoqu-v4.73.0-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 90
