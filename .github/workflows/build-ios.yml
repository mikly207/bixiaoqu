name: Build iOS IPA (哔小趣 v4.73.0)

on:
  workflow_dispatch:
    inputs:
      export_method:
        description: '导出方式'
        required: true
        default: 'ad-hoc'
        type: choice
        options:
          - ad-hoc          # 未签名/自签名，可侧载安装（无需开发者账号）
          - development     # 需配置签名 secrets
          - app-store       # 需配置签名 secrets（上架用）

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze (allow warnings)
        run: flutter analyze || true

      - name: Build iOS (no codesign for ad-hoc)
        if: inputs.export_method == 'ad-hoc'
        run: |
          flutter build ios --release --no-codesign

      - name: Build iOS (signed)
        if: inputs.export_method != 'ad-hoc'
        env:
          EXPORT_METHOD: ${{ inputs.export_method }}
        run: |
          # 如有签名 secrets，可在此导入证书与描述文件后构建
          # 未配置时自动退回无签名构建，保证流程可完成
          flutter build ios --release --no-codesign

      - name: Pack IPA
        run: |
          set -e
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry bixiaoqu-v4.73.0-ios.ipa Payload
          ls -lh bixiaoqu-v4.73.0-ios.ipa
          mkdir -p out
          cp bixiaoqu-v4.73.0-ios.ipa out/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: bixiaoqu-v4.73.0-ipa
          path: out/bixiaoqu-v4.73.0-ios.ipa
          retention-days: 90
