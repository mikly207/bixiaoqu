name: Build iOS IPA (哔小趣 v4.73.0)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: flutter-ios

      # 缓存 Flutter SDK
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - run: flutter pub get

      # 用 Flutter 3.24 重新生成 iOS 工程配置，修复旧模板 Podfile 引用 RunnerTests 但工程无此 target 的报错
      - name: Regenerate iOS project
        run: flutter create --platforms=ios --org com.bixiaoqu --project-name bixiaoqu .

      # 构建 release IPA（跳过签名，产出未签名包可侧载）
      - name: Build IPA
        run: flutter build ipa --release --no-codesign

      - name: List IPA
        run: ls -lh build/ios/ipa/ || true

      - uses: actions/upload-artifact@v4
        with:
          name: bixiaoqu-v4.73.0-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 90
