name: Build iOS IPA (哔小趣 v4.73.0)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    environment: PGYER_API_KEY
    permissions:
      contents: write
    timeout-minutes: 30
    env:
      PGYER_API_KEY: ${{ secrets.PGYER_API_KEY }}
      FIR_TOKEN: ${{ secrets.FIR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: flutter-ios

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - run: flutter pub get

      # 删除旧 ios 目录后用 Flutter 3.24 全新生成，保证 pbxproj 与 Podfile target 一致
      - name: Fresh iOS project
        run: |
          rm -rf ios
          flutter create --platforms=ios --org com.bixiaoqu --project-name bixiaoqu .

      # 锁定最低系统版本 iOS 12.0（现代 Xcode 工具链物理下限，覆盖 iOS 12→27）
      - name: Set deployment target iOS 12
        run: |
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 12.0;/g' ios/Runner.xcodeproj/project.pbxproj
          grep -m1 'IPHONEOS_DEPLOYMENT_TARGET' ios/Runner.xcodeproj/project.pbxproj

      # 构建 release（--no-codesign 产出 xcarchive）
      - name: Build archive
        run: flutter build ipa --release --no-codesign

      # 手动打包 IPA：从 xcarchive 提取 Runner.app → Payload → zip
      - name: Pack IPA
        run: |
          APP=$(find build/ios/archive/Runner.xcarchive -name "Runner.app" -type d | head -1)
          echo "Found app: $APP"
          mkdir -p Payload out
          cp -R "$APP" Payload/
          zip -qry out/bixiaoqu-v4.73.0-ios.ipa Payload
          ls -lh out/

      - uses: actions/upload-artifact@v4
        with:
          name: bixiaoqu-v4.73.0-ipa
          path: out/bixiaoqu-v4.73.0-ios.ipa
          if-no-files-found: error
          retention-days: 90

      # 上传到 Release（走 CDN，下载比 artifact 快得多）
      - name: Upload to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view v4.73.0 --repo ${{ github.repository }} >/dev/null 2>&1 || \
            gh release create v4.73.0 --title "哔小趣 v4.73.0" --notes "iOS IPA（iOS 12+，未签名，可交由蒲公英/fir.im 等平台签名分发）" --repo ${{ github.repository }}
          gh release upload v4.73.0 out/bixiaoqu-v4.73.0-ios.ipa --clobber --repo ${{ github.repository }}

      # 上传到蒲公英分发平台（API v2：getCOSToken → COS 上传 → 轮询出下载页）
      - name: Upload to Pgyer (API v2)
        if: ${{ env.PGYER_API_KEY != '' }}
        env:
          PGYER_API_KEY: ${{ secrets.PGYER_API_KEY }}
          PGYER_INSTALL_TYPE: ${{ vars.PGYER_INSTALL_TYPE || '1' }}
          PGYER_PASSWORD: ${{ secrets.PGYER_PASSWORD }}
        run: |
          set -e
          echo "① 获取上传凭证..."
          TOKEN=$(curl -s -X POST https://www.pgyer.com/apiv2/app/getCOSToken \
            -d "_api_key=$PGYER_API_KEY" -d "buildType=ios" \
            -d "buildInstallType=$PGYER_INSTALL_TYPE" \
            ${PGYER_PASSWORD:+--data-urlencode "buildPassword=$PGYER_PASSWORD"} \
            -d "buildDescription=哔小趣 v4.73.0 第三方代签分发" -d "buildUpdateDescription=iOS 12+ 兼容版")
          echo "$TOKEN"
          CODE=$(echo "$TOKEN" | python3 -c "import sys,json;print(json.load(sys.stdin).get('code'))")
          [ "$CODE" = "0" ] || { echo "getCOSToken 失败"; exit 1; }
          ENDPOINT=$(echo "$TOKEN" | python3 -c "import sys,json;print(json.load(sys.stdin)['data']['endpoint'])")
          CKEY=$(echo "$TOKEN" | python3 -c "import sys,json;print(json.load(sys.stdin)['data']['key'])")
          SIG=$(echo "$TOKEN" | python3 -c "import sys,json;print(json.load(sys.stdin)['data']['params']['signature'])")
          SECTOKEN=$(echo "$TOKEN" | python3 -c "import sys,json;print(json.load(sys.stdin)['data']['params']['x-cos-security-token'])")

          echo "② 上传 IPA 到 COS..."
          curl -s -o /dev/null -w "上传 HTTP %{http_code}\n" -X POST "$ENDPOINT" \
            -F "key=$CKEY" -F "signature=$SIG" -F "x-cos-security-token=$SECTOKEN" \
            -F "x-cos-meta-file-name=bixiaoqu-v4.73.0-ios.ipa" \
            -F "file=@out/bixiaoqu-v4.73.0-ios.ipa"

          echo "③ 轮询发布结果..."
          for i in $(seq 1 30); do
            INFO=$(curl -s "https://www.pgyer.com/apiv2/app/buildInfo?_api_key=$PGYER_API_KEY&buildKey=$CKEY")
            ICODE=$(echo "$INFO" | python3 -c "import sys,json;print(json.load(sys.stdin).get('code'))")
            if [ "$ICODE" = "0" ]; then
              echo "$INFO" | tee out/pgyer_response.json
              SHORT=$(echo "$INFO" | python3 -c "import sys,json;print(json.load(sys.stdin)['data']['buildShortcutUrl'])")
              echo "::notice::蒲公英代签完成，下载页 https://www.pgyer.com/$SHORT"
              break
            fi
            echo "发布中($i/30)，等待..."; sleep 4
          done

      # 上传到 fir.im 分发平台（备选，需配置 secrets：FIR_TOKEN）
      - name: Upload to fir.im
        if: ${{ env.FIR_TOKEN != '' }}
        env:
          FIR_TOKEN: ${{ secrets.FIR_TOKEN }}
        run: |
          echo "上传到 fir.im，由平台签名分发..."
          curl -s -X POST \
            -F "file=@out/bixiaoqu-v4.73.0-ios.ipa" \
            -F "token=$FIR_TOKEN" \
            -F "bundleId=com.bixiaoqu.bixiaoqu" \
            https://api.fir.im/apps | tee out/fir_response.json
