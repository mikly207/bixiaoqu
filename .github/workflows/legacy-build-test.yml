name: Legacy iOS Build Test (iOS 5.1 / armv7)
on:
  workflow_dispatch:

jobs:
  legacy-build:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: flutter-ios

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - run: flutter pub get

      - name: Fresh iOS project
        run: |
          rm -rf ios
          flutter create --platforms=ios --org com.bixiaoqu --project-name bixiaoqu .

      - name: Force iOS 5.1 deployment target + armv7
        run: |
          echo "=== 修改前 ==="
          grep -m2 'IPHONEOS_DEPLOYMENT_TARGET' ios/Runner.xcodeproj/project.pbxproj || true
          grep -i 'platform :ios' ios/Podfile || true
          echo "=== 强制设为 iOS 5.1 / armv7 ==="
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 5.1;/g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' "s/platform :ios, '[0-9.]*'/platform :ios, '5.1'/" ios/Podfile
          grep -m2 'IPHONEOS_DEPLOYMENT_TARGET' ios/Runner.xcodeproj/project.pbxproj
          grep -i 'platform :ios' ios/Podfile

      - name: pod install
        id: podinstall
        continue-on-error: true
        run: |
          cd ios && pod install --repo-update 2>&1 | tee /tmp/legacy_pod.log

      - name: Build (expected to fail)
        id: build
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flutter build ipa --release --no-codesign 2>&1 | tee /tmp/legacy_build.log
          echo "BUILD_EXIT=${PIPESTATUS[0]}" >> $GITHUB_ENV

      - name: Report real errors
        run: |
          echo "==================== 真实编译报错摘录 ===================="
          {
            echo "----- pod install -----"
            grep -iE "error|not support|minimum|deployment|platform|compatible" /tmp/legacy_pod.log 2>/dev/null | head -20 || true
            echo "----- flutter build -----"
            grep -iE "error|not support|minimum|deployment|armv7|32-bit|platform|valid" /tmp/legacy_build.log 2>/dev/null | head -30 || true
          } | tee /tmp/legacy_report.txt
          gh issue create --repo ${{ github.repository }} \
            --title "iOS 5.1/armv7 编译尝试的真实报错（技术可行性验证）" \
            --body "$(cat /tmp/legacy_report.txt)" 2>/dev/null || echo "(issue 创建失败，日志见本步骤输出)"
