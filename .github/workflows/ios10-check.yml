name: iOS 10 compatibility check (v4.73)
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: flutter-ios

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - run: flutter pub get

      - name: Fresh iOS project
        run: |
          rm -rf ios
          flutter create --platforms=ios --org com.bixiaoqu --project-name bixiaoqu .

      - name: Print Flutter engine minimum iOS version
        run: |
          PODSPEC="$FLUTTER_ROOT/packages/flutter/flutter_ios_podspec.json"
          echo "=== Flutter podspec: $PODSPEC ==="
          grep -iE 'platform|deployment|min' "$PODSPEC" | head -10 || true
          echo "=== 模板默认部署目标 ==="
          grep -rn 'IPHONEOS_DEPLOYMENT_TARGET' "$FLUTTER_ROOT/packages/flutter_tools/templates/app/ios.tmpl/Runner.xcodeproj/project.pbxproj.template" 2>/dev/null | head -3 || true

      - name: Force iOS 10.0
        run: |
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 10.0;/g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' "s/platform :ios, '[0-9.]*'/platform :ios, '10.0'/" ios/Podfile
          grep -m2 'IPHONEOS_DEPLOYMENT_TARGET' ios/Runner.xcodeproj/project.pbxproj

      - name: pod install at iOS 10
        id: podinstall
        continue-on-error: true
        run: cd ios && pod install --repo-update 2>&1 | tee /tmp/ios10_pod.log

      - name: Build at iOS 10
        id: build
        continue-on-error: true
        run: flutter build ipa --release --no-codesign 2>&1 | tee /tmp/ios10_build.log

      - name: Report
        run: |
          echo "==================== iOS 10 兼容性验证结果 ===================="
          echo "----- Flutter 引擎最低版本要求 -----"
          grep -iE 'platform|deployment|min' "$FLUTTER_ROOT/packages/flutter/flutter_ios_podspec.json" 2>/dev/null | head -5 || true
          echo "----- pod install 报错（关键行）-----"
          grep -iE "higher minimum|not compatible|required|error|deployment" /tmp/ios10_pod.log 2>/dev/null | grep -v "^$" | head -12 || true
          echo "----- flutter build 报错（关键行）-----"
          grep -iE "higher minimum|not compatible|required|error|deployment|minimum.*iOS|supported" /tmp/ios10_build.log 2>/dev/null | grep -v "^$" | head -15 || true
