<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>哔小趣 v4.19.0 竖屏播放页样式</title>
<style>
  :root{
    --pink:#FB7299;
    --bg:#0B0D10;
    --fg:#E9ECF1;
    --sub:#9AA1AC;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;padding:32px 16px 40px;
    background:radial-gradient(1200px 600px at 50% -10%, #17202b 0%, #0a0c0f 60%, #06070a 100%);
    font-family:-apple-system,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
    color:var(--fg);
    display:flex;flex-direction:column;align-items:center;gap:22px;
  }
  h1{font-size:17px;font-weight:700;margin:0;letter-spacing:.5px;}
  .hint{font-size:12px;color:var(--sub);margin:-14px 0 0;text-align:center;line-height:1.7;max-width:520px}
  .phone{
    position:relative;width:390px;height:844px;border-radius:44px;overflow:hidden;
    background:#000;
    box-shadow:0 0 0 10px #14171c,0 0 0 11px #2a2f37,0 40px 80px rgba(0,0,0,.65);
  }
  /* 模拟视频画面 */
  .video{
    position:absolute;inset:0;
    background:
      radial-gradient(420px 520px at 62% 34%, rgba(255,196,120,.55), transparent 62%),
      radial-gradient(360px 420px at 30% 68%, rgba(120,170,255,.45), transparent 60%),
      linear-gradient(160deg,#241a14 0%,#12141b 45%,#0a0c10 100%);
  }
  .video:after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,0) 22%,rgba(0,0,0,0) 46%,rgba(0,0,0,.62) 82%,rgba(0,0,0,.88) 100%);
  }
  .statusbar{
    position:absolute;top:0;left:0;right:0;height:44px;display:flex;align-items:center;
    justify-content:space-between;padding:0 26px;font-size:13px;font-weight:600;
    color:#fff;z-index:5;
  }
  .statusbar .right{display:flex;gap:6px;align-items:center;font-size:11px;opacity:.9}
  /* 顶部 */
  .back{
    position:absolute;top:52px;left:10px;width:36px;height:36px;border-radius:50%;
    background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:6;
  }
  .back svg{width:20px;height:20px}
  .more{
    position:absolute;top:52px;right:10px;width:36px;height:36px;border-radius:50%;
    background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:6;
  }
  .more i{display:block;width:16px;height:3px;border-radius:2px;background:#fff;position:relative}
  .more i:before,.more i:after{content:"";position:absolute;left:0;width:3px;height:3px;border-radius:50%;background:#fff}
  .more i:before{top:-6px}.more i:after{top:6px}
  /* 右侧互动栏 */
  .rail{
    position:absolute;right:2px;bottom:120px;width:66px;z-index:6;
    display:flex;flex-direction:column;align-items:center;
  }
  .rail .avatar{
    position:relative;width:66px;height:64px;display:flex;justify-content:center;
  }
  .rail .avatar .ring{
    width:50px;height:50px;border-radius:50%;margin-top:3px;
    background:conic-gradient(from 200deg,#7bd0ff,#8b7bff,#ff9bb8,#7bd0ff);
    box-shadow:0 0 0 2px #fff inset;
  }
  .rail .avatar .badge{
    position:absolute;bottom:0;left:50%;transform:translateX(-50%);
    width:22px;height:22px;border-radius:50%;background:var(--pink);
    color:#fff;font-size:14px;font-weight:700;line-height:22px;text-align:center;
    box-shadow:0 2px 6px rgba(0,0,0,.4);
  }
  .item{width:66px;margin-top:9px;display:flex;flex-direction:column;align-items:center;}
  .item .ico{
    width:28px;height:28px;display:flex;align-items:center;justify-content:center;
    filter:drop-shadow(0 1px 3px rgba(0,0,0,.65));
  }
  .item .ico svg{width:26px;height:26px;fill:#fff}
  .item .n{
    font-size:10.5px;color:#fff;margin-top:4px;
    text-shadow:0 1px 3px rgba(0,0,0,.6);
  }
  .item.liked .ico svg{fill:var(--pink)}
  .item.coined .ico svg{fill:#FFC53D}
  /* 底部信息 */
  .bottom{
    position:absolute;left:0;right:0;bottom:14px;z-index:6;
    padding:8px 14px 4px;
    background:linear-gradient(0deg,rgba(0,0,0,.65) 0%,rgba(0,0,0,.0) 100%);
  }
  .title{
    font-size:15px;font-weight:700;line-height:1.4;color:#fff;
    text-shadow:0 1px 4px rgba(0,0,0,.7);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .up{
    margin-top:5px;font-size:12px;color:#E3E6EA;text-shadow:0 1px 3px rgba(0,0,0,.6);
  }
  .up b{color:#fff;font-weight:600}
  .tools{display:flex;align-items:center;gap:0;margin-top:9px}
  .play{width:30px;height:30px;display:flex;align-items:center;justify-content:center}
  .play svg{width:20px;height:20px;fill:#fff}
  .time{font-size:10px;color:rgba(255,255,255,.9);font-family:ui-monospace,Menlo,monospace;margin-left:2px}
  .dms{
    margin-left:6px;width:32px;height:28px;border:1.5px solid #fff;border-radius:6px;
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;position:relative;
  }
  .dms:after{
    content:"";position:absolute;right:2px;bottom:1px;width:7px;height:4px;
    border-left:2px solid var(--pink);border-bottom:2px solid var(--pink);transform:rotate(-45deg);
  }
  .dmhint{
    margin-left:6px;margin-right:6px;flex:1;height:30px;border-radius:15px;
    background:rgba(255,255,255,.20);color:rgba(255,255,255,.85);
    font-size:11px;display:flex;align-items:center;padding:0 12px;
  }
  .txtbtn{font-size:11px;color:#fff;padding:6px 5px}
  .full{width:32px;height:32px;display:flex;align-items:center;justify-content:center;margin-left:2px}
  .full svg{width:18px;height:18px;fill:#fff}
  /* 进度条 */
  .seek{position:absolute;left:10px;right:10px;bottom:4px;height:2px;border-radius:1px;background:rgba(255,255,255,.22);z-index:7}
  .seek i{position:absolute;left:0;top:0;bottom:0;width:34%;border-radius:1px;background:rgba(251,114,153,.9)}
  .seek u{position:absolute;left:34%;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.5)}
  .cap{font-size:12px;color:var(--sub);text-align:center;line-height:1.8}
  .cap b{color:#cfd5de;font-weight:600}
</style>
</head>
<body>
  <h1>哔小趣 v4.19.0 · 竖屏播放页</h1>
  <p class="hint">竖屏视频默认进入这个沉浸式界面：画面铺满，控件浮在上面。单击画面可整组隐藏/显示。</p>

  <div class="phone">
    <div class="video"></div>

    <div class="statusbar">
      <span>10:25</span>
      <span class="right">5G ▮▮▮ 86</span>
    </div>

    <div class="back">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </div>
    <div class="more"><i></i></div>

    <div class="rail">
      <div class="avatar">
        <div class="ring"></div>
        <div class="badge">+</div>
      </div>

      <div class="item liked">
        <div class="ico"><svg viewBox="0 0 24 24"><path d="M7 10v11H4a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1h3zm2 0l4.2-6.3a1.6 1.6 0 0 1 2.9.9V9h4.3a2 2 0 0 1 2 2.4l-1.2 7A2 2 0 0 1 19.2 20H9V10z"/></svg></div>
        <div class="n">5.5万</div>
      </div>

      <div class="item">
        <div class="ico"><svg viewBox="0 0 24 24"><path d="M4 4h16a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H9l-4 4V5a1 1 0 0 1 1-1zm3 4v2h10V8H7zm0 4v2h7v-2H7z"/></svg></div>
        <div class="n">3725</div>
      </div>

      <div class="item">
        <div class="ico"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 2a8 8 0 1 1 0 16 8 8 0 0 1 0-16zm-.9 3v1.2c-1.3.2-2.3 1.1-2.3 2.4 0 1.5 1.2 2.1 2.6 2.5 1 .3 1.4.5 1.4.9 0 .4-.4.7-1.1.7-.9 0-1.5-.4-1.6-1.1H8.3c.1 1.4 1.1 2.3 2.6 2.6V18h1.9v-1.2c1.4-.2 2.4-1.1 2.4-2.5 0-1.5-1.2-2.1-2.7-2.5-.9-.2-1.3-.4-1.3-.8 0-.4.4-.6 1-.6.8 0 1.3.3 1.4 1h1.7c-.1-1.3-1-2.2-2.5-2.4V7h-1.9z"/></svg></div>
        <div class="n">6084</div>
      </div>

      <div class="item">
        <div class="ico"><svg viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6.1.8-4.5 4.2 1.2 6-5.4-3-5.4 3 1.2-6L3.3 9.4l6.1-.8z"/></svg></div>
        <div class="n">2.8万</div>
      </div>

      <div class="item">
        <div class="ico"><svg viewBox="0 0 24 24"><path d="M14 3l7 7-7 7v-4.2C8.9 12.8 5.6 15 3 19c0-6.4 3.9-10.9 11-11.4V3z"/></svg></div>
        <div class="n">7530</div>
      </div>
    </div>

    <div class="bottom">
      <div class="title">竟然吃得起！人民大会堂吃一顿多少钱？</div>
      <div class="up">UP主 · <b>郑安眠</b></div>
      <div class="tools">
        <div class="play"><svg viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg></div>
        <div class="time">00:12</div>
        <div class="dms">弹</div>
        <div class="dmhint">发个友善的弹幕见证当下</div>
        <div class="txtbtn">选集</div>
        <div class="txtbtn">倍速</div>
        <div class="full"><svg viewBox="0 0 24 24"><path d="M4 9V5a1 1 0 0 1 1-1h4v2H6v3H4zm16 0h-2V6h-3V4h4a1 1 0 0 1 1 1v4zM4 15h2v3h3v2H5a1 1 0 0 1-1-1v-4zm14 3v-3h2v4a1 1 0 0 1-1 1h-4v-2h3z"/></svg></div>
      </div>
    </div>

    <div class="seek"><i></i><u></u></div>
  </div>

  <p class="cap">
    <b>右侧</b>头像+关注徽标 · 赞 · 评论 · 投币 · 收藏 · 分享<br>
    <b>底部</b>标题 / UP 主 / 播放键 · 时间 · 弹幕开关 · 弹幕框 · 选集 · 倍速 · 全屏<br>
    <b>最底</b>2dp 细进度条 · <b>右上</b>更多（清晰度 / 解码 / 缓存）
  </p>
</body>
</html>
